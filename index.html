<style>
:root {
  /* 版式：600px 一栏的「签到簿」。每场活动左边一张日期签，报名人数用「正」字一笔一笔记，品牌是一枚「二代」朱印。 */
  --paper: #EDF1F0;
  --card: #FFFFFF;
  --ink: #16202A;
  --muted: #55626C;
  --faint: #86929A;
  --line: #D5DCDF;
  --tile: #E3E9E8;
  --seal: #BC3A2A;
  --seal-deep: #9C2D1F;
  --seal-text: #B23626;
  --seal-soft: #F6E2DD;
  --on-seal: #FFFFFF;
  --jade: #1F6658;
  --jade-soft: #DAEBE6;
  --on-jade: #FFFFFF;
  --amber: #8A5A0C;
  --amber-soft: #F3E7D0;
  --cover-ink: #16202A;
  --shadow: 0 1px 2px rgb(22 32 42 / .05), 0 14px 34px -22px rgb(22 32 42 / .45);
  /* 封面色：两种主题共用，上面永远是白字 */
  --cv-food: #A84A27; --cv-outdoor: #2A6446; --cv-sport: #24578C; --cv-welcome: #B03526;
  --cv-career: #43458C; --cv-city: #73437C; --cv-other: #565D4B;
  /* 类别文字色 / 浅底 */
  --c-food: #A84A27; --c-food-soft: #F4E3DA;
  --c-outdoor: #2A6446; --c-outdoor-soft: #DCECE2;
  --c-sport: #24578C; --c-sport-soft: #DCE6F2;
  --c-welcome: #B03526; --c-welcome-soft: #F6E2DD;
  --c-career: #43458C; --c-career-soft: #E3E3F2;
  --c-city: #73437C; --c-city-soft: #EEE1EF;
  --c-other: #565D4B; --c-other-soft: #E5E8DE;
  --f-display: "Noto Serif SC", "Songti SC", "STSong", "SimSun", serif;
  --f-body: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Noto Sans CJK SC", "Microsoft YaHei", system-ui, sans-serif;
  --r-sm: 4px;
  --r-md: 10px;
  --r-lg: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0E1416; --card: #151E22; --ink: #E4EAE8; --muted: #9CA8AE; --faint: #6D7A81; --line: #273238; --tile: #1C272C;
    --seal: #CC4733; --seal-deep: #B53B29; --seal-text: #F07A64; --seal-soft: #3B1F1A; --on-seal: #FFFFFF;
    --jade: #5DB4A2; --jade-soft: #15332E; --on-jade: #0E1416; --amber: #E2AC52; --amber-soft: #392D15;
    --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 14px 34px -22px rgb(0 0 0 / .9);
    --c-food: #E08A63; --c-food-soft: #3A251B; --c-outdoor: #63B48A; --c-outdoor-soft: #163021;
    --c-sport: #74A5DC; --c-sport-soft: #172739; --c-welcome: #EC7462; --c-welcome-soft: #3B1F1A;
    --c-career: #9799E2; --c-career-soft: #23243F; --c-city: #C894D2; --c-city-soft: #33233A;
    --c-other: #AAB397; --c-other-soft: #282C22;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0E1416; --card: #151E22; --ink: #E4EAE8; --muted: #9CA8AE; --faint: #6D7A81; --line: #273238; --tile: #1C272C;
  --seal: #CC4733; --seal-deep: #B53B29; --seal-text: #F07A64; --seal-soft: #3B1F1A; --on-seal: #FFFFFF;
  --jade: #5DB4A2; --jade-soft: #15332E; --on-jade: #0E1416; --amber: #E2AC52; --amber-soft: #392D15;
  --shadow: 0 1px 2px rgb(0 0 0 / .4), 0 14px 34px -22px rgb(0 0 0 / .9);
  --c-food: #E08A63; --c-food-soft: #3A251B; --c-outdoor: #63B48A; --c-outdoor-soft: #163021;
  --c-sport: #74A5DC; --c-sport-soft: #172739; --c-welcome: #EC7462; --c-welcome-soft: #3B1F1A;
  --c-career: #9799E2; --c-career-soft: #23243F; --c-city: #C894D2; --c-city-soft: #33233A;
  --c-other: #AAB397; --c-other-soft: #282C22;
  color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.65 var(--f-body); -webkit-font-smoothing: antialiased; }
a { color: inherit; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
img { max-width: 100%; }
h1, h2, h3, p, ul, ol, dl, dd, figure { margin: 0; }
h1, h2, h3 { text-wrap: balance; }
:focus-visible { outline: 2px solid var(--seal-text); outline-offset: 2px; }
.vh { position: absolute !important; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }

.wrap { max-width: 600px; margin: 0 auto; padding-inline: 16px; padding-block: 0 28px; }
main { display: grid; gap: 18px; padding-block: 10px 6px; }
.stack { display: grid; gap: 16px; }
.stack-sm { display: grid; gap: 10px; }
.stack-xs { display: grid; gap: 6px; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.between { justify-content: space-between; }
.grow { flex: 1 1 auto; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13.5px; line-height: 1.6; }
.tiny { font-size: 12.5px; line-height: 1.55; }
.h-page { font: 900 27px/1.28 var(--f-display); letter-spacing: .01em; }
.h-sec { font: 700 18px/1.4 var(--f-display); }
.eyebrow { font-size: 12px; letter-spacing: .16em; color: var(--muted); font-weight: 600; }
.link { color: var(--seal-text); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.linkish { background: none; border: 0; padding: 0; color: var(--seal-text); text-decoration: underline; text-underline-offset: 3px; font-size: inherit; font-weight: 600; }
.linkish.plain { color: var(--muted); font-weight: 400; }

/* 刊头 */
.mast { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 16px 4px; }
.brand { display: flex; align-items: center; gap: 11px; text-decoration: none; min-width: 0; }
.seal { flex: none; display: grid; place-items: center; width: 30px; height: 52px; border-radius: var(--r-sm); background: var(--seal); color: var(--on-seal); writing-mode: vertical-rl; font: 900 17px/1 var(--f-display); letter-spacing: 3px; box-shadow: inset 0 0 0 2px var(--seal), inset 0 0 0 3.5px rgb(255 255 255 / .9); }
.brand-name { display: block; font: 900 26px/1.05 var(--f-display); letter-spacing: .04em; }
.brand-sub { display: block; margin-top: 5px; font-size: 12px; letter-spacing: .14em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mast-tag { font-size: 12.5px; font-weight: 600; color: var(--seal-text); letter-spacing: .1em; }

/* 按钮与表单 */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 44px; padding: 0 18px; border-radius: var(--r-md); border: 1px solid transparent; font-weight: 700; font-size: 15px; line-height: 1.2; text-decoration: none; white-space: nowrap; transition: background-color .15s, border-color .15s, color .15s; }
.btn-sm { min-height: 36px; padding: 0 12px; font-size: 13.5px; font-weight: 600; }
.btn-xs { min-height: 30px; padding: 0 10px; font-size: 12.5px; font-weight: 600; border-radius: 8px; }
.btn-block { width: 100%; }
.btn-primary { background: var(--seal); color: var(--on-seal); }
.btn-primary:hover:not(:disabled) { background: var(--seal-deep); }
.btn-quiet { background: var(--card); border-color: var(--line); color: var(--ink); }
.btn-quiet:hover:not(:disabled) { border-color: var(--faint); }
.btn-ghost { background: transparent; color: var(--muted); }
.btn-ghost:hover:not(:disabled) { color: var(--ink); }
.btn-danger { background: transparent; border-color: var(--seal-text); color: var(--seal-text); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.in { width: 100%; min-height: 44px; padding: 9px 12px; border: 1px solid var(--line); border-radius: var(--r-md); background: var(--card); color: var(--ink); font-size: 16px; line-height: 1.4; }
textarea.in { resize: vertical; line-height: 1.6; }
.in::placeholder { color: var(--faint); }
.in:focus { outline: none; border-color: var(--seal-text); box-shadow: 0 0 0 3px var(--seal-soft); }
select.in { appearance: none; -webkit-appearance: none; padding-right: 34px; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 19px) 52%, calc(100% - 14px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }

/* 活动页 */
.back { justify-self: start; display: inline-flex; align-items: center; gap: 4px; min-height: 36px; padding: 0 8px; margin-left: -8px; border: 0; background: none; color: var(--muted); font-size: 14px; }

const partsFmt = new Intl.DateTimeFormat("en-US", { timeZone: TZ, year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "numeric", hourCycle: "h23", weekday: "short" });
function zp(ms) {
  const o = {};
  for (const p of partsFmt.formatToParts(new Date(ms))) o[p.type] = p.value;
  return { y: +o.year, m: +o.month, d: +o.day, hh: (+o.hour) % 24, mi: +o.minute, wd: o.weekday };
}
const WD = { Sun: "周日", Mon: "周一", Tue: "周二", Wed: "周三", Thu: "周四", Fri: "周五", Sat: "周六" };
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const fmtDay = (iso) => { const p = zp(Date.parse(iso)); return `${p.m}月${p.d}日 ${WD[p.wd]}`; };
const fmtClock = (iso) => { const p = zp(Date.parse(iso)); return `${pad(p.hh)}:${pad(p.mi)}`; };
const fmtStamp = (iso) => { const p = zp(Date.parse(iso)); return `${p.m}月${p.d}日 ${pad(p.hh)}:${pad(p.mi)}`; };
function fmtWhen(e) {
  const s = zp(Date.parse(e.starts_at));
  let out = `${s.m}月${s.d}日 ${WD[s.wd]} ${pad(s.hh)}:${pad(s.mi)}`;
  if (e.ends_at) {
    const t = zp(Date.parse(e.ends_at));
    out += t.y === s.y && t.m === s.m && t.d === s.d ? `–${pad(t.hh)}:${pad(t.mi)}` : ` 至 ${t.m}月${t.d}日 ${pad(t.hh)}:${pad(t.mi)}`;
  }
  return out;
}
function dayDiff(iso) {
  const a = zp(Date.now()), b = zp(Date.parse(iso));
  return Math.round((Date.UTC(b.y, b.m - 1, b.d) - Date.UTC(a.y, a.m - 1, a.d)) / 864e5);
}
// "2026-10-18T10:00"（多伦多墙上时间）→ ISO。夏令时切换那天也对。
function localToISO(v) {
  if (!v) return null;
  const [d, t = "00:00"] = v.split("T");
  const [y, m, dd] = d.split("-").map(Number);
  const [hh, mi] = t.split(":").map(Number);
  const want = Date.UTC(y, m - 1, dd, hh, mi);
  let ms = want;
  for (let i = 0; i < 3; i++) { const p = zp(ms); ms += want - Date.UTC(p.y, p.m - 1, p.d, p.hh, p.mi); }
  return new Date(ms).toISOString();
}
function isoToLocal(iso) {
  if (!iso) return "";
  const p = zp(Date.parse(iso));
  return `${p.y}-${pad(p.m)}-${pad(p.d)}T${pad(p.hh)}:${pad(p.mi)}`;
}

function statusPill(e, mine) {

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch {}
  try {
    const ta = document.createElement("textarea");
    ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand("copy"); ta.remove(); return ok;
  } catch { return false; }
}
async function copyOrShow(text, done) { if (await copyText(text)) UI.toast(done); else UI.manual(text); }
function downloadFile(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
const toTSV = (rows) => rows.map((r) => r.map((c) => String(c ?? "").replace(/[\t\r\n]+/g, " ")).join("\t")).join("\n");
const toCSV = (rows) => "\uFEFF" + rows.map((r) => r.map((c) => { const s = String(c ?? ""); return /[",\r\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s; }).join(",")).join("\r\n");
const icsStamp = (iso) => new Date(iso).toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
function icsFor(e, url) {
  const esc = (s) => String(s || "").replace(/\\/g, "\\\\").replace(/\r?\n/g, "\\n").replace(/,/g, "\\,").replace(/;/g, "\\;");
  const end = e.ends_at || new Date(endMs(e)).toISOString();
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//erdai//juhui//ZH", "CALSCALE:GREGORIAN", "METHOD:PUBLISH", "BEGIN:VEVENT",
    `UID:${e.id}@erdai-juhui`, `DTSTAMP:${icsStamp(new Date().toISOString())}`, `DTSTART:${icsStamp(e.starts_at)}`, `DTEND:${icsStamp(end)}`,
    `SUMMARY:${esc(e.title)}`, `LOCATION:${esc(e.location)}`, `DESCRIPTION:${esc((url ? url + "\n\n" : "") + (e.description || "").slice(0, 900))}`,
    url ? `URL:${url}` : null, "END:VEVENT", "END:VCALENDAR"].filter(Boolean).join("\r\n");
}
function gcalUrl(e, url) {
  const end = e.ends_at || new Date(endMs(e)).toISOString();
  const p = new URLSearchParams({ action: "TEMPLATE", text: e.title, dates: `${icsStamp(e.starts_at)}/${icsStamp(end)}`, location: e.location || "", details: (url ? url + "\n\n" : "") + (e.description || "").slice(0, 600) });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}

// 手机拍的原图动辄 4 MB，先缩小再上传：加载快，也省存储空间
async function shrinkImage(file, max = 1600, quality = 0.82) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(Object.assign(new Error("bad_image"), { code: "bad_image" })); i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * k); c.height = Math.round(img.naturalHeight * k);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    return await new Promise((res) => c.toBlob(res, "image/jpeg", quality));
  } finally { URL.revokeObjectURL(url); }
}
const blobToDataURL = (b) => new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(b); });
const isPdfPath = (p) => /\.pdf($|\?)/i.test(p) || p.startsWith("data:application/pdf");

/* ---------------------------------------------------------- 路由 */

const routeSubs = new Set();
let curHash = location.hash || "#/";
function setHash(h) { if (h === curHash) return; curHash = h; routeSubs.forEach((f) => { try { f(h); } catch {} }); }
// 先切页面再改地址栏：地址栏改不了（比如嵌在预览里）页面也照样走
function go(to) {
  try { if (location.hash !== to) location.hash = to; } catch {}
  setHash(to);
  try { window.scrollTo(0, 0); } catch {}
}
addEventListener("hashchange", () => setHash(location.hash || "#/"));
const nav = (to) => (ev) => {
  if (ev && (ev.metaKey || ev.ctrlKey || ev.shiftKey || ev.button === 1)) return;
  if (ev) ev.preventDefault();
  go(to);
};
function parseRoute(hash) {
  const p = hash.replace(/^#\/?/, "").split("/").filter(Boolean).map((s) => { try { return decodeURIComponent(s); } catch { return s; } });
  if (p[0] === "e" && p[1]) return { name: "event", slug: p[1] };
  if (p[0] === "new") return { name: "propose" };
  if (p[0] === "help") return { name: "help" };
  if (p[0] === "team") {
    if (p[1] === "e" && p[2]) return { name: "team-event", slug: p[2] };
    if (p[1] === "new") return { name: "team-new" };
    if (p[1] === "edit" && p[2]) return { name: "team-edit", slug: p[2] };
    return { name: "team", tab: p[1] === "budget" || p[1] === "review" ? p[1] : "events" };
  }
  return { name: "home" };
}
function useRoute() {
  const [h, setH] = useState(curHash);
  useEffect(() => { routeSubs.add(setH); if (curHash !== h) setH(curHash); return () => routeSubs.delete(setH); }, []);
  return parseRoute(h);
}

const PUBLIC_FIELDS = ["id", "slug", "status", "title", "starts_at", "ends_at", "location", "map_url", "categories", "capacity", "max_party", "waitlist", "closed", "cost_note", "description", "host_name", "host_contact", "cover_url"];
const EVENT_DEFAULTS = { status: "published", ends_at: null, map_url: null, categories: [], capacity: null, max_party: 4, waitlist: true, closed: false, cost_note: null, description: null, host_name: null, host_contact: null, cover_url: null, proposer_note: null, sponsor_plan: null, board_ok: false, wrapped: false, actual_count: null, actual_cost: null, sponsor_amount: null, wrap_notes: null, receipts: [] };

function liveApi() {
  const sb = window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey, { auth: { persistSession: true, storageKey: "erdai-auth" } });
  const rpc = async (fn, args) => { const { data, error } = await sb.rpc(fn, args || {}); if (error) throw error; return data; };
  const q = async (p) => { const { data, error } = await p; if (error) throw error; return data; };
  const team = {
    async session() {
      const { data } = await sb.auth.getSession();
      const user = data && data.session && data.session.user;
      if (!user) return null;
      const ok = await rpc("am_i_team").catch(() => false);
      return { email: user.email, notTeam: !ok };
    },
    async signIn(email, password) {
      const { error } = await sb.auth.signInWithPassword({ email, password });
      if (error) throw Object.assign(new Error("bad_login"), { code: "bad_login" });
      return team.session();
    },
    signOut: () => sb.auth.signOut(),
    events: () => q(sb.from("events").select("*, signups(id,name,party_size,status,is_new,attended,created_at)").order("starts_at")),
    async event(slug) {
      const e = await q(sb.from("events").select("*").eq("slug", slug).maybeSingle());
      if (!e) return null;
      return { event: e, signups: await q(sb.from("signups").select("*").eq("event_id", e.id).order("created_at")) };
    },
    saveEvent(row) {
      const { id, ...rest } = row;
      return id ? q(sb.from("events").update(rest).eq("id", id).select().single()) : q(sb.from("events").insert(rest).select().single());
    },
    patchEvent: (id, patch) => q(sb.from("events").update(patch).eq("id", id).select().single()),
    addGuest: (eventId, f) => rpc("team_add_guest", { p_event: eventId, p_name: f.name, p_party: f.party, p_wechat: f.wechat || null, p_is_new: !!f.isNew, p_note: f.note || null }),
    patchSignup: (id, patch) => q(sb.from("signups").update(patch).eq("id", id).select().single()),
    settings: () => q(sb.from("settings").select("*").eq("id", 1).single()),
    saveSettings: (patch) => q(sb.from("settings").update({ ...patch, updated_at: new Date().toISOString() }).eq("id", 1).select().single()),
    async uploadCover(blob) {
      const path = `${Date.now()}-${rand4()}.jpg`;
      const { error } = await sb.storage.from("covers").upload(path, blob, { contentType: "image/jpeg", cacheControl: "31536000" });
      if (error) throw error;
      return sb.storage.from("covers").getPublicUrl(path).data.publicUrl;
    },
    async uploadReceipt(eventId, blob, ext) {
      const path = `${eventId}/${Date.now()}-${rand4()}.${ext}`;
      const { error } = await sb.storage.from("receipts").upload(path, blob, { contentType: ext === "pdf" ? "application/pdf" : "image/jpeg" });
      if (error) throw error;
      return path;
    },
    async receiptUrl(path) {
      const { data, error } = await sb.storage.from("receipts").createSignedUrl(path, 3600);
      if (error) throw error;
      return data.signedUrl;
    },
    removeReceipt: (path) => sb.storage.from("receipts").remove([path]),
    receiptMax: 1800,
  };
  return {
    mode: "live",
    listEvents: async () => (await rpc("list_events")) || [],
    getEvent: (slug) => rpc("get_event", { p_slug: slug }),
    join: (slug, f) => rpc("join_event", { p_slug: slug, p_name: f.name, p_party: f.party, p_wechat: f.wechat || null, p_is_new: !!f.isNew, p_note: f.note || null }),
    mySignup: (token) => rpc("my_signup", { p_token: token }),

function demoApi() {
  const KEY = "erdai:demo:v1";
  let db = store.get(KEY, null);
  if (!db || !Array.isArray(db.events)) { db = demoSeed(); store.set(KEY, db); }
  const save = () => { if (!store.set(KEY, db)) UI.toast("这台设备的浏览器存储满了，演示数据这次不会保存。"); };
  const wait = () => new Promise((r) => setTimeout(r, 60 + Math.random() * 90));
  const fail = (code) => { throw Object.assign(new Error(code), { code }); };
  const ofEvent = (id) => db.signups.filter((s) => s.event_id === id).sort(byCreated);
  const goingHeads = (id) => heads(ofEvent(id).filter((s) => s.status === "going"));
  function pub(e) {
    const ss = ofEvent(e.id);
    const going = ss.filter((s) => s.status === "going");
    const o = {};
    for (const k of PUBLIC_FIELDS) o[k] = e[k];
    return { ...clone(o), going: heads(going), waiting: heads(ss.filter((s) => s.status === "waitlist")), initials: going.map((s) => initialOf(s.name)), actual_count: e.wrapped ? e.actual_count : null };
  }
  function status(s) {
    const e = db.events.find((x) => x.id === s.event_id);
    const position = s.status === "waitlist" ? ofEvent(s.event_id).filter((w) => w.status === "waitlist" && byCreated(w, s) < 0).length + 1 : null;
    return { id: s.id, token: s.cancel_token, status: s.status, name: s.name, party_size: s.party_size, position, event_id: s.event_id, slug: e && e.slug, event_status: e && e.status };
  }
  // 候补递补：按报名顺序，装得下就转正；一组人太多装不下就先跳过、保留位置
  function promote(id) {
    const e = db.events.find((x) => x.id === id);
    if (!e) return;
    const wl = ofEvent(id).filter((s) => s.status === "waitlist");
    if (e.capacity == null) { wl.forEach((s) => { s.status = "going"; }); return; }
    let left = e.capacity - goingHeads(id);
    for (const s of wl) { if (left <= 0) break; if (s.party_size <= left) { s.status = "going"; left -= s.party_size; } }
  }
  function insert(e, f, source) {
    const fits = e.capacity == null || goingHeads(e.id) + f.party <= e.capacity;
    const st = fits ? "going" : source === "team" || e.waitlist ? "waitlist" : null;
    if (!st) fail("full");
    const s = { id: uid(), event_id: e.id, name: f.name.slice(0, 40), party_size: f.party, wechat: (f.wechat || "").slice(0, 60) || null, is_new: !!f.isNew, note: (f.note || "").slice(0, 300) || null, status: st, attended: false, source, cancel_token: uid(), cancel_reason: null, created_at: new Date().toISOString(), cancelled_at: null };
    db.signups.push(s); save();
    return status(s);
  }
  const team = {
    async session() { return session.get("erdai:demo:team") ? { email: "演示账号" } : null; },
    async signIn() { session.set("erdai:demo:team", "1"); return { email: "演示账号" }; },
    async signOut() { session.del("erdai:demo:team"); },
    async events() { await wait(); return clone(db.events.slice().sort(byStart).map((e) => ({ ...e, signups: ofEvent(e.id) }))); },
    async event(slug) { await wait(); const e = db.events.find((x) => x.slug === slug); return e ? clone({ event: e, signups: ofEvent(e.id) }) : null; },
    async saveEvent(row) {
      await wait();
      if (row.id) {
        const e = db.events.find((x) => x.id === row.id);
        if (!e) fail("not_found");
        const capChanged = "capacity" in row && row.capacity !== e.capacity;
        Object.assign(e, clone(row), { updated_at: new Date().toISOString() });
        if (capChanged) promote(e.id);
        save(); return clone(e);
      }
      const e = { ...clone(EVENT_DEFAULTS), ...clone(row), id: uid(), created_at: new Date().toISOString() };
      db.events.push(e); save(); return clone(e);
    },
    patchEvent: (id, patch) => team.saveEvent({ ...patch, id }),
    async addGuest(eventId, f) { await wait(); const e = db.events.find((x) => x.id === eventId); if (!e) fail("not_found"); return insert(e, f, "team"); },
    async patchSignup(id, patch) {
      await wait();
      const s = db.signups.find((x) => x.id === id);
      if (!s) fail("not_found");
      const wasGoing = s.status === "going";
      Object.assign(s, patch);
      if (wasGoing && s.status !== "going") promote(s.event_id);
      save(); return clone(s);
    },
    async settings() { return { ...db.settings }; },
    async saveSettings(patch) { Object.assign(db.settings, patch); save(); return { ...db.settings }; },
    async uploadCover(blob) { const d = await blobToDataURL(blob); if (d.length > 1.4e6) fail("too_big"); return d; },
    async uploadReceipt(eventId, blob) { const d = await blobToDataURL(blob); if (d.length > 1.4e6) fail("too_big"); return d; },
    async receiptUrl(path) { return path; },
    async removeReceipt() {},
    receiptMax: 1100,
  };
  return {
    mode: "demo",
    async listEvents() { await wait(); return db.events.filter((e) => e.status === "published").sort(byStart).map(pub); },
    async getEvent(slug) { await wait(); const e = db.events.find((x) => x.slug === slug && (x.status === "published" || x.status === "cancelled")); return e ? pub(e) : null; },
    async join(slug, f) {
      await wait();
      const e = db.events.find((x) => x.slug === slug && x.status === "published");
      const name = (f.name || "").trim();
      if (!name) fail("name_required");
      if (!e) fail("not_found");
      if (e.closed) fail("closed");
      if (hasStarted(e)) fail("started");
      if (!(f.party >= 1 && f.party <= e.max_party)) fail("party_size");
      if (ofEvent(e.id).some((s) => s.status !== "cancelled" && s.name.trim().toLowerCase() === name.toLowerCase())) fail("duplicate");
      return insert(e, { ...f, name }, "web");
    },
    async mySignup(token) { await wait(); const s = db.signups.find((x) => x.cancel_token === token); return s ? status(s) : null; },
    async cancel(token, reason) {
      await wait();
      const s = db.signups.find((x) => x.cancel_token === token && x.status !== "cancelled");
      if (!s) return false;
      const wasGoing = s.status === "going";
      Object.assign(s, { status: "cancelled", cancelled_at: new Date().toISOString(), cancel_reason: reason || null });
      if (wasGoing) promote(s.event_id);
      save(); return true;
    },
    async submitEvent(p) {
      await wait();
      if (db.events.filter((e) => e.status === "pending").length >= 30) fail("too_many_pending");
      const e = { ...clone(EVENT_DEFAULTS), ...clone(p), id: uid(), slug: makeSlug(p.starts_at), status: "pending", created_at: new Date().toISOString() };
      db.events.push(e); save(); return { slug: e.slug };
    },
    reset() { db = demoSeed(); save(); store.del(MINE_KEY); },
    team,
  };
}

// 一个「正」字五笔，记五个人。实笔是已报名，浅笔是空位，超出名额的笔不画。
const ZHENG = [[3, 4, 17, 4], [10, 4, 10, 16.5], [10, 10.2, 15.5, 10.2], [5.2, 9.6, 5.2, 16.5], [2.5, 16.5, 17.5, 16.5]];
function Tally({ going, capacity, size = 18, big = false }) {
  const total = Math.max(capacity == null ? going : capacity, going);
  if (total <= 0 || total > 200) return null;
  const step = big ? Math.max(10, Math.min(45, 900 / Math.max(1, going))) : 0;
  const glyphs = [];
  for (let i = 0; i < Math.ceil(total / 5); i++) {
    const strokes = [];
    for (let j = 0; j < 5; j++) {
      const k = i * 5 + j;
      if (k >= total) break;
      const s = ZHENG[j], on = k < going;
      strokes.push(html`<line key=${j} x1=${s[0]} y1=${s[1]} x2=${s[2]} y2=${s[3]} class=${on ? "on" : "off"} style=${big && on ? { "--d": Math.round(k * step) + "ms" } : null} />`);
    }
    glyphs.push(html`<svg key=${i} viewBox="0 0 20 20" width=${size} height=${size} aria-hidden="true">${strokes}</svg>`);
  }
  const label = capacity == null ? `已报名 ${going} 人` : `已报名 ${going} 人，共 ${capacity} 个名额`;
  return html`<div class=${"tally" + (big ? " big" : "")} role="img" aria-label=${label}>${glyphs}</div>`;
}

    <output id=${id} aria-live="polite">${value}</output>
    <button type="button" aria-label="加一" disabled=${value >= max} onClick=${() => onChange(Math.min(max, value + 1))}>+</button>

}

// 介绍文字：*加粗*、「- 」开头是列表、「1. 」开头是编号，链接自动可点
function parseRich(text) {
  const out = [];
  let list = null, para = null;
  for (const raw of String(text || "").split(/\r?\n/)) {
    const line = raw.replace(/\s+$/, "");
    const ul = /^\s*[-•·]\s+(.+)$/.exec(line);
    const ol = /^\s*(\d{1,2})(?:[.)]\s+|、\s*)(.+)$/.exec(line);
    if (ul || ol) {
      const t = ul ? "ul" : "ol";
      if (!list || list.t !== t) { list = { t, items: [] }; out.push(list); }
      list.items.push(ul ? ul[1] : ol[2]);
      para = null;
      continue;
    }
    list = null;
    if (!line.trim()) { para = null; continue; }
    if (para) para.s += "\n" + line; else { para = { t: "p", s: line }; out.push(para); }
  }
  return out;
}
function Inline({ s }) {
  const parts = [];
  const re = /\*([^*\n]+)\*|(https?:\/\/[^\s<>"'，。！？）)】]+)/g;
  let last = 0, m, k = 0;
  const text = (t) => t.split("\n").forEach((seg, i) => { if (i) parts.push(html`<br key=${"b" + k++} />`); if (seg) parts.push(seg); });
  while ((m = re.exec(s))) {
    if (m.index > last) text(s.slice(last, m.index));
    if (m[1]) parts.push(html`<strong key=${"s" + k++}>${m[1]}</strong>`);
    else { const short = m[2].replace(/^https?:\/\/(www\.)?/, ""); parts.push(html`<a key=${"a" + k++} class="link" href=${m[2]} target="_blank" rel="noopener">${short.length > 40 ? short.slice(0, 40) + "…" : short}</a>`); }
    last = re.lastIndex;
  }
  if (last < s.length) text(s.slice(last));
  return parts;
}
function RichText({ text }) {
  const blocks = useMemo(() => parseRich(text), [text]);
  return html`<div class="rich">${blocks.map((b, i) =>
    b.t === "ul" ? html`<ul key=${i}>${b.items.map((x, j) => html`<li key=${j}><${Inline} s=${x} /></li>`)}</ul>`
    : b.t === "ol" ? html`<ol key=${i}>${b.items.map((x, j) => html`<li key=${j}><${Inline} s=${x} /></li>`)}</ol>`
    : html`<p key=${i}><${Inline} s=${b.s} /></p>`)}</div>`;
}

  return html`<article class="stack">

    ${!cancelled && html`<${WhoGoing} e=${e} />`}
    ${!cancelled && !isPast(e) && html`<${ShareRow} e=${e} />`}
  </article>`;
}

const EMPTY_FORM = { title: "", categories: [], start: "", end: "", location: "", map_url: "", capacity: "", max_party: 4, waitlist: true, cost_note: "", description: "", host_name: "", host_contact: "", proposer_note: "", cover_url: "", sponsor_plan: "", board_ok: false };
function toForm(e) {
  const f = { ...EMPTY_FORM };
  for (const k of Object.keys(EMPTY_FORM)) if (e[k] != null) f[k] = e[k];
  return { ...f, start: isoToLocal(e.starts_at), end: isoToLocal(e.ends_at), capacity: e.capacity == null ? "" : String(e.capacity), sponsor_plan: e.sponsor_plan == null ? "" : String(e.sponsor_plan), categories: (e.categories || []).slice() };
}
function EventForm({ mode, initial, settings, onDone }) {
  const team = mode !== "propose";
  const [f, setF] = useState(() => (initial ? toForm(initial) : { ...EMPTY_FORM, host_name: mode === "propose" ? Me.get().name || "" : "" }));
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  const [coverBusy, setCoverBusy] = useState(false);
  const set = (k) => (x) => { const t = x.target; setF((o) => ({ ...o, [k]: t.type === "checkbox" ? t.checked : t.value })); };
  const toggleCat = (k) => setF((o) => {
    let next = o.categories.includes(k) ? o.categories.filter((c) => c !== k) : [...o.categories, k];
    if (next.length > 2) next = next.slice(-2);
    return { ...o, categories: next };
  });
  function validate() {
    if (!f.title.trim()) return "写一个活动名称。";
    if (!f.categories.length) return "选一个活动类型。";
    if (!f.start) return "填一下开始时间。";
    const s = Date.parse(localToISO(f.start));
    if (mode !== "team-edit" && s < Date.now()) return "开始时间已经过去了。";
    if (f.end && Date.parse(localToISO(f.end)) <= s) return "结束时间要晚于开始时间。";
    if (!f.location.trim()) return "写一下地点。没定的话写「具体见群公告」。";
    if (f.map_url.trim() && !/^https?:\/\//i.test(f.map_url.trim())) return "地图链接要以 http 开头，或者留空。";
    if (f.capacity !== "" && !(/^\d+$/.test(String(f.capacity)) && +f.capacity >= 1 && +f.capacity <= 500)) return "人数上限填 1–500 的整数，不限就留空。";
    if (!f.host_name.trim()) return "写一下组织者的名字。";
    if (team && f.sponsor_plan !== "" && !(+f.sponsor_plan >= 0)) return "校友会承担的金额填一个数字。";
    return "";
  }
  async function onCover(ev) {
    const file = ev.target.files && ev.target.files[0];
    ev.target.value = "";
    if (!file) return;
    setCoverBusy(true);
    try { const blob = await shrinkImage(file, 1600, 0.82); const url = await api.team.uploadCover(blob); setF((o) => ({ ...o, cover_url: url })); }
    catch (x) { UI.toast(errText(x)); }
    setCoverBusy(false);
  }
  async function submit(ev) {
    ev.preventDefault();
    const msg = validate();
    if (msg) { setErr(msg); return; }
    setBusy(true); setErr("");
    const p = {
      title: f.title.trim(), categories: f.categories, starts_at: localToISO(f.start), ends_at: f.end ? localToISO(f.end) : null,
      location: f.location.trim(), map_url: f.map_url.trim() || null, capacity: f.capacity === "" ? null : parseInt(f.capacity, 10),
      max_party: +f.max_party, waitlist: !!f.waitlist, cost_note: f.cost_note.trim() || null, description: f.description.trim() || null,
      host_name: f.host_name.trim(), host_contact: f.host_contact.trim() || null,
    };
    if (mode === "propose") p.proposer_note = f.proposer_note.trim() || null;
    if (team) { p.cover_url = f.cover_url || null; p.sponsor_plan = f.sponsor_plan === "" ? null : +f.sponsor_plan; p.board_ok = !!f.board_ok; }
    let saved;
    try {
      if (mode === "propose") saved = await api.submitEvent(p);
      else if (mode === "team-new") saved = await api.team.saveEvent({ ...p, slug: makeSlug(p.starts_at), status: "published" });
      else saved = await api.team.saveEvent({ ...p, id: initial.id });
    } catch (x) { setErr(errText(x)); setBusy(false); return; }
    if (mode !== "propose") UI.toast(mode === "team-new" ? "已发布" : "已保存");
    onDone(saved);
  }
  const big = team && settings && f.sponsor_plan !== "" && +f.sponsor_plan >= +settings.big_amount;
  return html`<form class="stack" onSubmit=${submit} novalidate>
    <p class="hint"><span class="req" style="margin:0 2px 0 0">*</span>为必填，其余可以留空。</p>
    <div class="field"><label for="f-title">活动名称<${Req} /></label>
      <input id="f-title" class="in" required maxlength="80" value=${f.title} onInput=${set("title")} placeholder="比如：High Park 秋叶徒步" /></div>
    <div class="field"><span class="label">类型<${Req} /> <span class="opt-tag">选 1–2 个</span></span>
      <div class="chips wrap">${CATS.map((c) => html`<button type="button" key=${c.key} class=${"fchip cat-" + c.key + (f.categories.includes(c.key) ? " on" : "")} aria-pressed=${f.categories.includes(c.key)} onClick=${() => toggleCat(c.key)}><${MiniSeal} c=${c} />${c.label}</button>`)}</div></div>
    <div class="grid2">
      <div class="field"><label for="f-start">开始<${Req} /></label><input id="f-start" class="in" type="datetime-local" required value=${f.start} onInput=${set("start")} /></div>
      <div class="field"><label for="f-end">结束 <span class="opt-tag">选填</span></label><input id="f-end" class="in" type="datetime-local" value=${f.end} onInput=${set("end")} /></div>
    </div>
    <p class="hint" style="margin-top:-8px">按${CONFIG.city}当地时间填。</p>
    <div class="field"><label for="f-loc">地点<${Req} /></label>
      <input id="f-loc" class="in" required maxlength="200" value=${f.location} onInput=${set("location")} placeholder="店名、地址，或「具体见群公告」" /></div>
    <div class="field"><label for="f-map">地图链接 <span class="opt-tag">选填</span></label>
      <input id="f-map" class="in" type="url" maxlength="500" value=${f.map_url} onInput=${set("map_url")} placeholder="Google 地图的分享链接" />
      <p class="hint">不填的话，「地图」按钮会按地点搜索。</p></div>
    <div class="grid2">
      <div class="field"><label for="f-cap">人数上限</label>
        <input id="f-cap" class="in" type="number" inputmode="numeric" min="1" max="500" value=${f.capacity} onInput=${set("capacity")} placeholder="不限" />
        <p class="hint">按人头算，留空就是不限。</p></div>
      <div class="field"><label for="f-party">每人最多带几位</label>
        <select id="f-party" class="in" onChange=${set("max_party")}>${[1, 2, 3, 4, 5, 6].map((n) => html`<option key=${n} value=${n} selected=${+f.max_party === n}>${n === 1 ? "只能自己来" : `连自己共 ${n} 人`}</option>`)}</select></div>
    </div>
    <label class="check" for="f-wait"><input id="f-wait" type="checkbox" checked=${f.waitlist} onChange=${set("waitlist")} />
      <span>满了以后开放候补<span class="hint block">有人取消时，系统按报名顺序自动补上。</span></span></label>
    <div class="field"><label for="f-cost">费用 <span class="opt-tag">选填</span></label>
      <input id="f-cost" class="in" maxlength="120" value=${f.cost_note} onInput=${set("cost_note")} placeholder="比如：免费 / AA 约 $30，校友会每人补贴 $10" /></div>
    <div class="field"><label for="f-desc">介绍</label>
      <textarea id="f-desc" class="in" rows="7" maxlength="5000" value=${f.description} onInput=${set("description")} placeholder="做什么、要带什么、几点到……"></textarea>
      <p class="hint">*两边加星号* 会加粗，「- 」开头的行会变成列表，链接自动可点。${f.description.length} / 5000</p></div>
    <div class="grid2">
      <div class="field"><label for="f-host">组织者<${Req} /></label><input id="f-host" class="in" required maxlength="60" value=${f.host_name} onInput=${set("host_name")} /></div>
      <div class="field"><label for="f-contact">联系方式 <span class="opt-tag">会公开</span></label><input id="f-contact" class="in" maxlength="120" value=${f.host_contact} onInput=${set("host_contact")} placeholder="微信号，或「群里 @我」" /></div>
    </div>
    ${mode === "propose" && html`<div class="field"><label for="f-pnote">给核心团队的话 <span class="opt-tag">不公开</span></label>
      <textarea id="f-pnote" class="in" rows="3" maxlength="500" value=${f.proposer_note} onInput=${set("proposer_note")} placeholder="需要校友会经费吗？大概多少？核心团队怎么联系你？"></textarea></div>`}
    ${team && html`<fieldset class="team-only"><legend>核心团队填写</legend>
      <div class="field"><span class="label">封面 <span class="opt-tag">选填</span></span>
        <${Cover} e=${{ categories: f.categories, cover_url: f.cover_url }} />
        <div class="row"><label class="btn btn-quiet btn-sm">${coverBusy ? "上传中…" : f.cover_url ? "换一张" : "上传照片"}<input class="vh" type="file" accept="image/*" onChange=${onCover} /></label>
          ${f.cover_url && html`<button type="button" class="btn btn-ghost btn-sm" onClick=${() => setF((o) => ({ ...o, cover_url: "" }))}>用默认封面</button>`}</div>

    </fieldset>`}
    ${err && html`<p class="err" role="alert">${err}</p>`}
    <div class="row"><button class="btn btn-primary" type="submit" disabled=${busy}>${busy ? "提交中…" : mode === "propose" ? "提交给核心团队" : mode === "team-new" ? "发布" : "保存"}</button></div>

}

function teamStats(e, signups) {
  const ss = signups || e.signups || [];
  const going = ss.filter((s) => s.status === "going");
  return { going: heads(going), waiting: heads(ss.filter((s) => s.status === "waitlist")), newcomers: going.filter((s) => s.is_new).length, attended: heads(going.filter((s) => s.attended)) };
}
function TeamLogin({ onIn }) {
  const [email, setEmail] = useState("");

  const [busy, setBusy] = useState(false);

    <h1 class="h-page">核心团队入口</h1>

    <p class="small muted">正式版每个人用自己的邮箱和密码登录（账号在 Supabase 里创建）。演示版直接进：</p>

    <div class="field"><label for="t-pw">密码</label><input id="t-pw" class="in" type="password" autocomplete="current-password" value=${pw} onInput=${(x) => setPw(x.target.value)} /></div>
    ${err && html`<p class="err" role="alert">${err}</p>`}

    <p class="tiny muted">还没有账号？让管理 Supabase 的人在 Authentication → Users 里加你，再把你的邮箱加进 team 表。</p>

function TeamEvents({ events, reload }) {
  const [showOther, setShowOther] = useState(false);
  const pending = events.filter((e) => e.status === "pending");

/* -------------------------------------------------------- 预算 / 回顾 */

function yearsOf(events) {
  const ys = new Set([thisYear()]);
  for (const e of events) if (e.status === "published") ys.add(yearOf(e.starts_at));
  return Array.from(ys).sort((a, b) => b - a).slice(0, 4);
}
function YearPick({ years, year, onPick }) {
  if (years.length < 2) return null;
  return html`<div class="years" role="group" aria-label="选年份">${years.map((y) => html`<button key=${y} class=${"fchip" + (y === year ? " on" : "")} aria-pressed=${y === year} onClick=${() => onPick(y)}>${y}</button>`)}</div>`;
}
function Budget({ events, settings, reload }) {
  const years = yearsOf(events);
  const [year, setYear] = useState(thisYear());
  const [edit, setEdit] = useState(false);
  const [yb, setYb] = useState(String(settings.year_budget));
  const [ba, setBa] = useState(String(settings.big_amount));
  const [busy, setBusy] = useState(false);
  const list = events.filter((e) => e.status === "published" && yearOf(e.starts_at) === year).sort(byStart);
  const used = sum(list.filter((e) => e.wrapped).map((e) => e.sponsor_amount));
  const planned = sum(list.filter((e) => !e.wrapped).map((e) => e.sponsor_plan));
  const budget = +settings.year_budget || 0;
  const left = budget - used - planned;
  const pct = (x) => (budget > 0 ? Math.min(100, (x / budget) * 100) : 0);
  const big = +settings.big_amount || 0;
  const flags = list.filter((e) => big > 0 && Math.max(+e.sponsor_plan || 0, +e.sponsor_amount || 0) >= big && !e.board_ok);
  async function saveSettings(ev) {
    ev.preventDefault();
    if (!(+yb >= 0) || !(+ba >= 0)) { UI.toast("金额填数字"); return; }
    setBusy(true);
    try { await api.team.saveSettings({ year_budget: +yb, big_amount: +ba }); } catch (x) { UI.toast(errText(x)); setBusy(false); return; }
    UI.toast("预算已更新"); setBusy(false); setEdit(false); reload();
  }
  return html`<div class="stack">
    <${YearPick} years=${years} year=${year} onPick=${setYear} />
    <section class="card stack-sm">
      <div class="row between"><h2 class="h-sec">${year} 年校友会经费</h2><button class="btn btn-ghost btn-sm" onClick=${() => setEdit(!edit)}>${edit ? "收起" : "改预算"}</button></div>
      <p class="money"><b>${money(used)}</b><span class="muted small">已用 · 年度预算 ${money(budget)}</span></p>
      <div class="meter" role="img" aria-label=${`已用 ${money(used)}，已排期预计 ${money(planned)}，预算 ${money(budget)}`}><i class="used" style=${{ width: pct(used) + "%" }}></i><i class="plan" style=${{ width: pct(planned) + "%" }}></i></div>
      <div class="legend"><span><i class="sw used"></i>已结算 ${money(used)}</span><span><i class="sw plan"></i>已排期预计 ${money(planned)}</span><span><i class="sw"></i>${left >= 0 ? `还剩 ${money(left)}` : `预计超出 ${money(-left)}`}</span></div>
      ${edit && html`<form class="stack-sm" onSubmit=${saveSettings}>
        <div class="grid2">
          <div class="field"><label for="b-year">年度预算（加元）</label><input id="b-year" class="in" type="number" inputmode="numeric" min="0" value=${yb} onInput=${(x) => setYb(x.target.value)} /></div>
          <div class="field"><label for="b-big">「较大金额」从多少算起</label><input id="b-big" class="in" type="number" inputmode="numeric" min="0" value=${ba} onInput=${(x) => setBa(x.target.value)} /></div>
        </div>
        <button class="btn btn-primary btn-sm" style="justify-self:start" disabled=${busy}>保存</button>
      </form>`}
      <p class="tiny muted">理事会拟提供每年 $3,000–$5,000，预算内自主安排。单场校友会承担达到 ${money(big)} 算较大金额，要提前和理事会沟通。确定的金额出来后在「改预算」里更新。</p>
    </section>
    ${flags.length > 0 && html`<section class="card warn-card stack-sm">
      <h2 class="h-sec">这几场要先和理事会打招呼</h2>
      <p class="small">校友会承担 ≥ ${money(big)}，还没标记「已和理事会沟通」。沟通完在活动的编辑页勾上。</p>
      <ul class="srows">${flags.map((e) => html`<li key=${e.id} class="srow"><a class="srow-main" href=${"#/team/edit/" + e.slug} onClick=${nav("#/team/edit/" + e.slug)}><span style="font-weight:700">${e.title}</span><span class="tiny muted">${fmtDay(e.starts_at)} · ${money(Math.max(+e.sponsor_plan || 0, +e.sponsor_amount || 0))}</span></a></li>`)}</ul>
    </section>`}
    <div class="table-wrap"><table class="t">
      <thead><tr><th>日期</th><th>活动</th><th class="num">计划</th><th class="num">实际</th><th>状态</th></tr></thead>
      <tbody>${list.length ? list.map((e) => html`<tr key=${e.id}>
        <td>${fmtDay(e.starts_at).split(" ")[0]}</td>
        <td class="title"><a href=${"#/team/e/" + e.slug} onClick=${nav("#/team/e/" + e.slug)}>${e.title}</a></td>
        <td class="num">${e.sponsor_plan == null ? "—" : money(e.sponsor_plan)}</td>
        <td class="num">${e.wrapped ? money(e.sponsor_amount) : "—"}</td>
        <td>${e.wrapped ? html`<span class="pill ok">已结算</span>` : isPast(e) ? html`<span class="pill warn">待结算</span>` : html`<span class="pill">已排期</span>`}</td>
      </tr>`) : html`<tr><td colspan="5" class="muted">这一年还没有活动。</td></tr>`}</tbody>
    </table></div>
  </div>`;
}
const normName = (s) => String(s || "").trim().toLowerCase().replace(/\s+/g, "");
function buildReview(events, year, settings) {
  const list = events.filter((e) => e.status === "published" && yearOf(e.starts_at) === year).sort(byStart);
  const done = list.filter(isPast), planned = list.filter((e) => !isPast(e));
  const rows = list.map((e) => ({ e, st: teamStats(e) }));
  const doneRows = rows.filter((r) => isPast(r.e));
  const wrapped = list.filter((e) => e.wrapped);
  const people = new Set();
  for (const e of done) for (const s of e.signups || []) if (s.status === "going") people.add(normName(s.name));
  const byMonth = Array.from({ length: 12 }, () => []);
  for (const e of list) byMonth[zp(Date.parse(e.starts_at)).m - 1].push(e);
  const byCat = CATS.map((c) => ({ c, n: list.filter((e) => ((e.categories || [])[0] || "other") === c.key).length })).filter((x) => x.n > 0);
  return {
    year, list, done, planned, rows, wrapped, byMonth, byCat,
    signups: sum(doneRows.map((r) => r.st.going)),
    attend: sum(wrapped.map((e) => e.actual_count)),
    unwrapped: done.filter((e) => !e.wrapped).length,
    newcomers: sum(doneRows.map((r) => r.st.newcomers)),
    unique: people.size,
    spent: sum(wrapped.map((e) => e.sponsor_amount)),
    plannedSpend: sum(list.filter((e) => !e.wrapped).map((e) => e.sponsor_plan)),
    selfPaid: sum(wrapped.map((e) => Math.max(0, (+e.actual_cost || 0) - (+e.sponsor_amount || 0)))),
    receiptsOk: wrapped.filter((e) => (e.receipts || []).length > 0).length,
    budget: +settings.year_budget || 0,
  };
}
function reviewText(r) {
  const [lo, hi] = CONFIG.yearTarget;
  const L = [`二代聚会 · ${r.year} 年度小结（截至 ${todayLabel()}）`, ""];
  L.push(`活动：已办 ${r.done.length} 场${r.planned.length ? `，另有 ${r.planned.length} 场已排期` : ""}（目标每年 ${lo}–${hi} 场）`);
  L.push(`参与：实到 ${r.attend} 人次（报名 ${r.signups} 人次），约 ${r.unique} 位不同的朋友参加过，其中新朋友 ${r.newcomers} 位`);
  if (r.unwrapped) L.push(`（还有 ${r.unwrapped} 场没登记实到人数）`);
  L.push(`经费：校友会预算 ${money(r.budget)}，已用 ${money(r.spent)}${r.budget ? `（${Math.round((r.spent / r.budget) * 100)}%）` : ""}${r.plannedSpend ? `，已排期活动预计再用 ${money(r.plannedSpend)}` : ""}；大家自费 / AA 合计 ${money(r.selfPaid)}`);
  if (r.byCat.length) L.push(`类型：${r.byCat.map((x) => `${x.c.label} ${x.n}`).join(" · ")}`);
  L.push(`收据：已结算 ${r.wrapped.length} 场，${r.receiptsOk} 场有收据`);
  if (r.done.length) {
    L.push("", "逐场：");
    for (const { e, st } of r.rows.filter((x) => isPast(x.e))) {
      L.push(`· ${fmtDay(e.starts_at).split(" ")[0]} ${e.title}｜${e.wrapped ? `实到 ${e.actual_count} 人｜花费 ${money(e.actual_cost)}，校友会 ${money(e.sponsor_amount)}` : `报名 ${st.going} 人｜未结算`}`);
    }
  }
  return L.join("\n");
}
function reviewRows(r) {
  const rows = [["日期", "活动", "类型", "报名人数", "实到人数", "新朋友", "总花费", "校友会承担", "自费/AA", "收据张数", "下次注意"]];
  for (const { e, st } of r.rows) rows.push([fmtDay(e.starts_at), e.title, (e.categories || []).map((k) => catOf(k).label).join("/"), st.going, e.wrapped ? e.actual_count : "", st.newcomers, e.wrapped ? e.actual_cost ?? "" : "", e.wrapped ? e.sponsor_amount ?? "" : e.sponsor_plan ?? "", e.wrapped ? Math.max(0, (+e.actual_cost || 0) - (+e.sponsor_amount || 0)) : "", (e.receipts || []).length, e.wrap_notes || ""]);
  return rows;
}
function Review({ events, settings }) {
  const years = yearsOf(events);
  const [year, setYear] = useState(thisYear());
  const r = useMemo(() => buildReview(events, year, settings), [events, year, settings]);
  const text = reviewText(r);
  const [lo, hi] = CONFIG.yearTarget;
  const nowMonth = year === thisYear() ? zp(Date.now()).m : 0;
  const total = r.byCat.reduce((a, x) => a + x.n, 0);
  return html`<div class="stack">
    <${YearPick} years=${years} year=${year} onPick=${setYear} />
    <header class="stack-xs"><p class="eyebrow">${CONFIG.org} · 二代聚会</p><h2 class="h-page">${year} 年度回顾</h2>
      <p class="small muted">截至 ${todayLabel()}，从每场活动的报名和结算自动汇总。</p></header>
    <div class="kpis">
      <${Kpi} n=${r.done.length} unit=" 场" label=${`已办（目标 ${lo}–${hi} 场）`} sub=${r.planned.length ? `另有 ${r.planned.length} 场已排期` : ""} />
      <${Kpi} n=${r.attend} label="实到人次" sub=${`报名 ${r.signups} 人次`} />
      <${Kpi} n=${r.unique} label="不同的朋友" sub=${`新朋友 ${r.newcomers} 位`} />
      <${Kpi} n=${money(r.spent)} label="校友会经费已用" sub=${r.budget ? `占预算 ${Math.round((r.spent / r.budget) * 100)}%` : ""} />
    </div>
    ${r.unwrapped > 0 && html`<p class="notice small">还有 ${r.unwrapped} 场结束了但没结算，实到人数和花费暂时没算进来。到「活动」里的「待结算」补上。</p>`}
    <section class="card stack-sm"><h3 class="h-sec">一年的节奏</h3>
      <div class="months" role="img" aria-label=${`${year} 年每月活动：` + r.byMonth.map((l, i) => `${i + 1}月 ${l.length} 场`).join("，")}>${r.byMonth.map((l, i) => html`<div key=${i} class=${"mo" + (i + 1 === nowMonth ? " now" : "")}><div class="dots">${l.map((e) => html`<i key=${e.id} class=${"dot cat-" + catOf((e.categories || [])[0]).key + (isPast(e) ? "" : " plan")} title=${e.title}></i>`)}</div><span>${i + 1}</span></div>`)}</div>
      <p class="tiny muted">每格一场，按月份排。实心是已办，空心是已排期，颜色是活动类型。</p>
    </section>
    ${total > 0 && html`<section class="card stack-sm"><h3 class="h-sec">活动类型</h3>
      <div class="mix" role="img" aria-label=${r.byCat.map((x) => `${x.c.label} ${x.n} 场`).join("，")}>${r.byCat.map((x) => html`<i key=${x.c.key} class=${"cat-" + x.c.key} style=${{ flexGrow: x.n }}></i>`)}</div>
      <ul class="mix-legend">${r.byCat.map((x) => html`<li key=${x.c.key}><${MiniSeal} c=${x.c} />${x.c.label} <b>${x.n}</b></li>`)}</ul>
    </section>`}
    <div class="table-wrap"><table class="t">
      <thead><tr><th>日期</th><th>活动</th><th class="num">报名</th><th class="num">实到</th><th class="num">新朋友</th><th class="num">花费</th><th class="num">校友会</th><th class="num">收据</th></tr></thead>
      <tbody>${r.rows.length ? r.rows.map(({ e, st }) => html`<tr key=${e.id}>
        <td>${fmtDay(e.starts_at).split(" ")[0]}</td>
        <td class="title"><a href=${"#/team/e/" + e.slug} onClick=${nav("#/team/e/" + e.slug)}>${e.title}</a></td>
        <td class="num">${st.going}</td>
        <td class="num">${e.wrapped ? e.actual_count : "—"}</td>
        <td class="num">${st.newcomers}</td>
        <td class="num">${e.wrapped && e.actual_cost != null ? money(e.actual_cost) : "—"}</td>
        <td class="num">${e.wrapped ? money(e.sponsor_amount) : e.sponsor_plan != null ? html`<span class="muted">计划 ${money(e.sponsor_plan)}</span>` : "—"}</td>
        <td class="num">${(e.receipts || []).length || (e.wrapped ? html`<span class="pill warn">缺</span>` : "—")}</td>
      </tr>`) : html`<tr><td colspan="8" class="muted">这一年还没有活动。</td></tr>`}</tbody>
    </table></div>
    <section class="card stack-sm"><h3 class="h-sec">发给理事会的文字版</h3>
      <pre class="pre">${text}</pre>
      <div class="row">
        <button class="btn btn-primary btn-sm" onClick=${() => copyOrShow(text, "已复制，可以直接发到微信")}>复制文字版</button>
        <button class="btn btn-quiet btn-sm" onClick=${() => copyOrShow(toTSV(reviewRows(r)), "表格已复制，可以贴进 Excel")}>复制表格</button>
        ${!FRAMED && html`<button class="btn btn-quiet btn-sm" onClick=${() => downloadFile(`二代聚会-${year}-年度回顾.csv`, toCSV(reviewRows(r)), "text/csv;charset=utf-8")}>下载 CSV</button>`}
      </div>
    </section>
  </div>`;
}

/* ---------------------------------------------------------------- App */

function ManualCopy({ text, onClose }) {
  return html`<div class="sheet" role="dialog" aria-modal="true" aria-label="手动复制">
    <div class="sheet-card">
      <p class="small">这里没法自动复制。长按下面的文字，全选后复制：</p>
      <textarea class="in" rows="8" readonly value=${text} onFocus=${(x) => x.target.select()}></textarea>
      <button class="btn btn-quiet btn-block" onClick=${onClose}>关闭</button>
    </div>
  </div>`;
}
function App() {
  const route = useRoute();
  const [toast, setToast] = useState(null);
  const [manual, setManual] = useState(null);
  const [lightbox, setLightbox] = useState(null);
  const [ver, setVer] = useState(0);
  const timer = useRef(0);
  UI.toast = (m) => { setToast(m); clearTimeout(timer.current); timer.current = setTimeout(() => setToast(null), 2800); };
  UI.manual = setManual;
  UI.lightbox = setLightbox;
  UI.refresh = () => setVer((v) => v + 1);
  useEffect(() => {
    if (route.name !== "event") document.title = route.name.startsWith("team") ? "核心团队 · 二代聚会" : "二代聚会";
  }, [route.name]);
  let page;
  if (route.name === "event") page = html`<${EventPage} key=${route.slug} slug=${route.slug} />`;
  else if (route.name === "propose") page = html`<${Propose} />`;
  else if (route.name === "help") page = html`<${Help} />`;
  else if (route.name === "home") page = html`<${Home} />`;
  else page = html`<${TeamArea} route=${route} />`;
  return html`<div class="wrap">
      <${Masthead} team=${route.name.startsWith("team")} />
      ${api.mode === "demo" && html`<${DemoBanner} />`}
      <main id="main" key=${ver}><${Boundary} key=${route.name + ":" + (route.slug || route.tab || "")}>${page}<//></main>
      <${Footer} />
    </div>
    ${toast && html`<div class="toast" role="status" aria-live="polite">${toast}</div>`}
    ${manual != null && html`<${ManualCopy} text=${manual} onClose=${() => setManual(null)} />`}
    ${lightbox && html`<div class="lightbox" role="dialog" aria-modal="true" aria-label="收据大图" onClick=${() => setLightbox(null)}><img src=${lightbox} alt="收据" /><button class="btn btn-quiet btn-sm">关闭</button></div>`}`;
}

function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement("script"); s.src = src; s.onload = res; s.onerror = () => rej(new Error("script_failed")); document.head.appendChild(s); });
}
(async function boot() {
  const root = document.getElementById("app");
  try {
    if (LIVE) { await loadScript(SUPABASE_JS); api = liveApi(); }
    else api = demoApi();
  } catch {
    root.innerHTML = '<div class="wrap"><p class="notice" style="margin-top:24px">连不上数据库服务。检查一下网络，刷新再试。</p></div>';
    return;
  }
  root.textContent = "";
  render(html`<${App} />`, root);
})();
</script>
